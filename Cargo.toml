[workspace]
members = ["packages/*"]
exclude = []
resolver = "2"

[workspace.package]
version = "0.1.1" #tag:release-version
edition = "2024"
rust-version = "1.85.0"

authors = ["mtn81 <nantsuka2011@gmail.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/mtn81/portalenv"

[workspace.dependencies.portalenv-core]
path = "packages/core"
version = "0.1.1" #tag:release-version

[workspace.dependencies.portalenv-macro]
path = "packages/macro"
version = "0.1.1" #tag:release-version
