[package]
name = "portalenv-macro"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Macros for portalenv."

[dependencies]
proc-macro2 = "1.0.69"
quote = "1.0.33"
syn = { version = "3.0.5", features = [
    "full",
    "extra-traits",
    "visit-mut",
    "visit",
] }
proc-macro-error = "1.0.4"

[lib]
proc-macro = true

[features]
default = []
